name: ci
on:
  push:
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    # The database tests run against a throwaway Postgres; the name must end in _test or the setup refuses it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: desk
          POSTGRES_PASSWORD: desk
          POSTGRES_DB: desk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U desk -d desk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://desk:desk@localhost:5432/desk_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - run: ./contracts/setup.sh # pinned forge-std tarball, checksum verified
      - run: forge build --sizes
        working-directory: contracts
      - run: forge test --no-match-path 'test/fork/*'
        working-directory: contracts
      # Fork tests need live chain state and a patient RPC, so they do not run on every push.
      # Run them by hand before any deploy: pnpm --filter @desk/contracts test:fork
